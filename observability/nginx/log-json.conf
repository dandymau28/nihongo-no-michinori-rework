# One JSON object per request, so Grafana can filter on status, uri and duration
# instead of grepping a text blob. Install to /etc/nginx/conf.d/log-json.conf
# (conf.d is inside nginx's http block, where log_format belongs).

log_format json_access escape=json '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"agent":"$http_user_agent"'
'}';

# Optional: log a masked IP instead of the visitor's real one. An IP address is
# personal data, and 30 days of them is a small liability; the trade-off is that you
# can no longer tell two visitors apart, or trace abuse back to one address.
# To use it, uncomment this map and change "ip":"$remote_addr" above to "ip":"$ip_masked".
#
# map $remote_addr $ip_masked {
#     ~^(?<net>\d+\.\d+\.\d+)\.\d+$  "$net.0";      # IPv4: drop the last octet
#     ~^(?<prefix>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):  "$prefix::";  # IPv6: keep /64
#     default                         "unknown";
# }
