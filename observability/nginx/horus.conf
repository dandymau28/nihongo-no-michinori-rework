# Grafana at horus.xerzack.web.id. Install to /etc/nginx/sites-available/horus,
# symlink it into sites-enabled, then let Certbot add the TLS parts:
#   sudo certbot --nginx -d horus.xerzack.web.id --redirect
#
# Grafana itself listens on 127.0.0.1:3001 only, so this vhost is the only way in.
server {
    listen 80;
    listen [::]:80;
    server_name horus.xerzack.web.id;

    access_log /var/log/nginx/horus.access.json.log json_access;
    error_log  /var/log/nginx/horus.error.log;

    # Dashboards can hold a lot of rows; don't let a slow query be cut off.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live streams dashboard updates over a websocket.
    location /api/live/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
