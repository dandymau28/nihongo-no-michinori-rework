# Loki 3.x, single binary, filesystem storage — sized for a 2 GB VPS.
# Install to /etc/loki/config.yml. Data lives in /var/lib/loki (owned by the loki user).
auth_enabled: false

server:
  # Only Alloy (pushing) and Grafana (querying) talk to Loki, both on this host.
  # Port 3110, because 3100 belongs to the app's legacy single-port service.
  http_listen_address: 127.0.0.1
  http_listen_port: 3110
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days of logs. One small site writes a few MB a day, so this stays well
  # under a gigabyte — raise it only after checking `du -sh /var/lib/loki`.
  retention_period: 720h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_streams_per_user: 1000
  max_global_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true

compactor:
  working_directory: /var/lib/loki/compactor
  # Without this, retention_period is ignored and the disk fills up.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 1h

ingester:
  # Bigger, rarer chunks: less memory and fewer files than the defaults.
  chunk_idle_period: 15m
  chunk_target_size: 1048576
  max_chunk_age: 2h
  wal:
    enabled: true
    dir: /var/lib/loki/wal

querier:
  max_concurrent: 2

frontend:
  max_outstanding_per_tenant: 256

analytics:
  reporting_enabled: false
