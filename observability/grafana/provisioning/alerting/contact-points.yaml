# Install to /etc/grafana/provisioning/alerting/contact-points.yaml
# Where alerts go. The address comes from ALERT_EMAIL in /etc/grafana/db.env (root-only,
# not in git), and delivery needs the GF_SMTP_* settings from the same file.
#
# Provisioning the notification policy makes it read-only in the Grafana UI; edit it here
# and restart Grafana instead.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: michinori-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by:
      - alertname
    # Wait half a minute to bundle a burst, then at most one repeat every 4 hours while
    # the problem is still firing.
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 4h
