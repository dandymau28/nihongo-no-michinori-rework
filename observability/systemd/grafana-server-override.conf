# Install to /etc/systemd/system/grafana-server.service.d/override.conf
# Configures Grafana through environment variables (they beat /etc/grafana/grafana.ini)
# and keeps it from crowding out the app on a 2 GB box.
[Service]
# The database password for the Grafana datasource. Root-only file, not in git:
#   sudo install -m 600 -o root -g root /dev/null /etc/grafana/db.env
EnvironmentFile=-/etc/grafana/db.env

# Reachable only through the nginx vhost for horus.xerzack.web.id.
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3001
Environment=GF_SERVER_DOMAIN=horus.xerzack.web.id
Environment=GF_SERVER_ROOT_URL=https://horus.xerzack.web.id/
Environment=GF_SERVER_ENFORCE_DOMAIN=false

# One account: yours. No self-registration, no anonymous viewers.
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_USERS_ALLOW_ORG_CREATE=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_AUTH_BASIC_ENABLED=true

# No phoning home, no news feed, no gravatar lookups.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
Environment=GF_SECURITY_COOKIE_SECURE=true
Environment=GF_SNAPSHOTS_EXTERNAL_ENABLED=false

# 1.9 GB of RAM, shared with the app, PostgreSQL and (during a deploy) a Next.js build.
# MemoryHigh throttles before MemoryMax kills, and a high OOMScoreAdjust means the
# kernel picks Grafana — not the site — if memory ever runs out.
MemoryHigh=200M
MemoryMax=280M
OOMScoreAdjust=600
